name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: liger_user
          POSTGRES_PASSWORD: liger_ci
          POSTGRES_DB: liger_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U liger_user"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Types
        run: mypy app
      - name: Migrations up-down-up (R5)
        env:
          DATABASE_URL: postgresql+psycopg2://liger_user:liger_ci@localhost:5432/liger_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Tests (Postgres)
        env:
          DATABASE_URL: postgresql+psycopg2://liger_user:liger_ci@localhost:5432/liger_test
          REDIS_URL: redis://localhost:6379/0
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=85
      - name: Concurrency gate (BR-CR-20, needs real row locks)
        env:
          TEST_POSTGRES_URL: postgresql+psycopg2://liger_user:liger_ci@localhost:5432/liger_concurrency
          PGPASSWORD: liger_ci
        run: |
          psql -h localhost -U liger_user -d postgres -c "CREATE DATABASE liger_concurrency;"
          pytest -q tests/credit/test_concurrency_postgres.py

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend_new
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend_new/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
